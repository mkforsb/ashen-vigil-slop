[workspace]
resolver = "2"
members = ["crates/engine", "crates/game", "crates/web"]
default-members = ["crates/engine", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
glow = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ashen-engine = { path = "crates/engine" }
ashen-game = { path = "crates/game" }

# The game simulation is too slow unoptimised, even while developing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
